<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Colorizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="hero">
            <h1>Modern Image Magic</h1>
            <p>Upload a black and white photo to preview color changes instantly.</p>
        </header>

        <section class="upload-box">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <label for="fileInput" class="btn-primary">Choose an Image</label>
            
            <div class="preview-container">
                <img id="imagePreview" src="https://images.unsplash.com/photo-1501472312651-726afe119ff1?q=80&w=600&auto=format&fit=crop" alt="Preview">
            </div>

            <div class="controls">
                <button id="toggleColor" class="btn-secondary">Reveal Full Color</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
