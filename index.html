<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Colorizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="hero">
            <h1>Modern Image Magic</h1>
            <p>Upload a colorful photo to watch it transition dynamically!</p>
        </header>

        <section class="upload-box">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <label for="fileInput" class="upload-label" id="dropZone">
                <span class="upload-icon">📸</span>
                <span class="btn-primary">Choose an Image</span>
                <span class="upload-text">or drag and drop your file here</span>
            </label>
            
            <div class="preview-container">
                <img id="imagePreview" src="https://unsplash.com" alt="Preview">
            </div>

            <div class="controls">
                <button id="toggleColor" class="btn-secondary">Reveal Full Color</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
